<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MultiSaúde — agenda, pacientes e gestão de clínicas" />
    <title>Clínica Multi Saúde</title>
    <script>
      // Antes da primeira pintura: aplica tema (claro/escuro/sistema) e
      // densidade salvos, pra não piscar o tema errado ao carregar.
      (function () {
        try {
          var t = localStorage.getItem("ui-theme") || "light";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) r.setAttribute("data-theme", "dark");
          if (localStorage.getItem("ui-density") === "compact") r.setAttribute("data-density", "compact");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
